services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hwwbd
      POSTGRES_USER: hwwbd
      POSTGRES_PASSWORD: hwwbd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hwwbd -d hwwbd"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - hwwbd-postgres:/var/lib/postgresql/data

  nex:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PN_HWWBD_AUTH_PORT: "27600"
      PN_HWWBD_SECURE_PORT: "27601"
      # The address a console is told to reach the secure server on. Override
      # in .env or the shell; defaults to localhost for a LAN test.
      PN_HWWBD_SECURE_HOST: ${PN_HWWBD_SECURE_HOST:-localhost}
      PN_HWWBD_POSTGRES_URI: postgres://hwwbd:hwwbd@postgres:5432/hwwbd?sslmode=disable
      PN_HWWBD_KERBEROS_PASSWORD: ${PN_HWWBD_KERBEROS_PASSWORD:-change-me}
      # Local preservation mode: accounts from settings.json, login token not
      # validated. Flip to shared mode by setting PN_HWWBD_LOCAL_MODE=0 and
      # providing the two NEX_* secrets (matching your account server).
      PN_HWWBD_LOCAL_MODE: ${PN_HWWBD_LOCAL_MODE:-1}
      PN_HWWBD_SETTINGS_PATH: /home/go/app/settings.json
      PN_HWWBD_NEX_TOKEN_AES_KEY: ${PN_HWWBD_NEX_TOKEN_AES_KEY:-}
      PN_HWWBD_NEX_PASSWORD_SECRET: ${PN_HWWBD_NEX_PASSWORD_SECRET:-}
    ports:
      - "27600:27600/udp"
      - "27601:27601/udp"
    volumes:
      - ./settings.json:/home/go/app/settings.json:ro

volumes:
  hwwbd-postgres:
